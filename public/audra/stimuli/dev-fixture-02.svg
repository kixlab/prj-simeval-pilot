<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    DEVELOPMENT FIXTURE ONLY - NOT AN OFFICIAL CAP/MTCI STIMULUS.

    Four incomplete contours: two short diagonals leaning away from each other,
    and two arcs of one circle broken at the bottom. Traced by hand from an
    image supplied for testing, not taken from a published instrument and not
    validated for scoring. Replace with the official stimulus set before
    collecting analysable data.

    The two arcs lie on a single circle (centre 496 426, radius 342), so they
    read as one interrupted curve rather than two unrelated strokes.

    Drawn in the same near-black ink and stroke weight as participant marks, so
    the contours carry no colour, weight, or label cue that a participant could
    read as extra task information. Stroke width 6 matches the pencil default and
    survives the 224 px AuDrA scoring render as solid ink.
  -->
  <rect width="1024" height="1024" fill="#ffffff"/>
  <g fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 441.6 220.2 L 348.2 386.6"/>
    <path d="M 572.2 224.0 L 659.2 384.0"/>
    <path d="M 166.8 518.5 A 342 342 0 0 0 434.8 762.5"/>
    <path d="M 575.8 758.6 A 342 342 0 0 0 825.2 518.5"/>
  </g>
</svg>
